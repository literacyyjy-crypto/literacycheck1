<html lang="ko">
<head>
<meta charset="utf-8">

<title>읽기능력 체크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --fg:#1a1f2b; --muted:#636878; --line:#dedbd3; --soft:#edebe5;
  --accent:#1f3a5f; --accent-fg:#ffffff; --stamp:#5b6678; --ok:#3f7d58;
  --c-info:#3a6385; --c-intent:#6a5b8c; --c-emo:#a5634f; --c-narr:#4f7a63;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif; color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:640px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--stamp);font-weight:700;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:700;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{margin-top:5px;width:18px;height:18px;flex:none}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.passage{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px 16px 14px;font-family:var(--serif);font-size:15.5px;line-height:1.85}
.passage .src{font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:700}
.passage p+p,.passage ul+p,.passage p+ul{margin-top:8px}
.passage ul,.passage ol{margin:6px 0;padding-left:20px}
.passage li{margin:3px 0}
.passage .poem p{margin:0}
.passage .poem{margin:2px 0}
.passage .gap{height:10px}
.passage .box{font-family:var(--sans);font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.7}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-family:var(--sans);font-size:14px;min-width:320px;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{background:var(--soft)}
.q{margin-top:6px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
.qno{font-weight:700;color:var(--stamp);flex:none}
.qstem{font-weight:500}
.pre{font-family:var(--serif);font-size:15px;background:var(--soft);border-radius:8px;padding:12px;margin-bottom:10px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;min-height:48px;box-sizing:border-box;align-items:center}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{flex:none;width:22px;color:var(--muted);font-weight:700}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:has(input:checked) .mk{color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.skip{font:inherit;font-size:13px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:8px;padding:6px 0}
.skip[aria-pressed="true"]{color:var(--stamp);font-weight:700}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
hr{border:0;border-top:1px dashed var(--line);margin:22px 0}
/* result */
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px;transform:rotate(-2deg)}
.type{border-top:6px solid var(--tc,var(--accent))}
.type h1{font-size:30px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--fg)}
.areas{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:52px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.atrack{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.atrack i{display:block;height:100%;border-radius:99px}
.radar{width:100%;max-width:300px;margin:0 auto;display:block}
.radar text{font-family:var(--sans);font-size:12px;fill:var(--fg);font-weight:700}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:24px}
details.more[open] summary{margin-bottom:0}
.note{font-size:14px;background:var(--soft);border-radius:10px;padding:10px 12px}
textarea.code{width:100%;min-height:64px;font:12px/1.4 ui-monospace,monospace;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:8px}
.hero svg{width:240px;height:auto;margin-bottom:6px}
.hero h1{font-size:27px}
.hero .sub{color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{font-size:13px;background:var(--soft);border-radius:99px;padding:4px 12px}
.hero .btn{width:100%}
.hero .consent{text-align:left;width:100%}
.fine{font-size:12.5px;color:var(--muted)}
@media (max-width:400px){h1{font-size:25px}.type h1{font-size:26px}}
/* ---- 성인용 톤 ---- */
body{font-size:16px;line-height:1.7}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
h1{font-size:30px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--stamp);font-weight:500}
.btn{border-radius:8px;font-weight:500;letter-spacing:.01em}
.card{border-radius:10px;border-color:var(--line);box-shadow:none}
.passage{border-radius:6px;border-left:3px solid var(--accent);font-size:16px;line-height:1.9}
.opt{border-radius:8px;background:var(--card)}
.opt:has(input:checked){background:#eef2f7;box-shadow:inset 0 0 0 1px var(--accent)}
.opt .mk{font-weight:500}
.bar{height:3px;border-radius:0}.bar i{border-radius:0}
.qno{color:var(--accent)}
.pill{border-radius:4px;background:transparent;border:1px solid var(--line);font-weight:500}
.chips{gap:0}
.chips span{background:none;border-radius:0;padding:0 14px;border-left:1px solid var(--line);font-size:13px;color:var(--muted)}
.chips span:first-child{border-left:0}
.type{border-top:3px solid var(--tc,var(--accent));border-radius:10px}
.note{background:var(--soft);border-radius:6px}
</style>

</head>

<script>
/* ===== 설정: 아래 두 값을 README 순서대로 채워 넣으세요 ===== */

const KEY="rd-2026-1112";       // Code.gs의 SECRET과 같은 값
/* ============================================================ */
/*CORE_START*/
const AREAS=[
  {k:"info",name:"정보",full:"정보 독해"},
  {k:"intent",name:"의도",full:"의도 독해"},
  {k:"emo",name:"정서",full:"정서 독해"},
  {k:"narr",name:"서사",full:"서사 독해"}
];
const TIE_ORDER=["intent","emo","narr","info"]; // 최종 동점 처리 순서 (임의 추첨 없음)
const WEIGHTS={}; // 시범 응시 후 문항별 난이도 가중치를 채움. 비어 있으면 모두 1
const SHAPE_GAP=2; // 최고-최저 점수 차이가 이 값 이상이면 '뾰족형'
const TYPES={
  info_sharp:{name:"정확한 내비게이터",line:"적힌 내용을 정확히 짚어 상황에 맞게 적용하는 독자예요.",desc:"안내문, 약관, 도표처럼 조건과 순서가 있는 글에서 길을 잃지 않아요. 다만 행간이나 감정을 읽는 영역은 상대적으로 덜 쓰고 있을 수 있어요."},
  info_flat:{name:"든든한 안내자",line:"정보 읽기가 가장 안정적이고, 다른 영역과의 차이도 크지 않아요.",desc:"사실을 파악하는 힘이 바탕이 되고, 다른 영역도 비슷한 수준으로 받쳐 주는 편이에요."},
  intent_sharp:{name:"행간 탐정",line:"글 뒤에 숨은 의도와 사실·해석의 경계를 잘 가려내요.",desc:"광고, 보도자료, 후기처럼 목적이 있는 글을 비판적으로 읽는 힘이 돋보여요. 다른 영역에서는 상대적으로 힘을 덜 쓰고 있을 수 있어요."},
  intent_flat:{name:"균형 잡힌 분석가",line:"의도 읽기가 가장 높고, 네 영역이 비교적 고르게 받쳐 줘요.",desc:"글의 목적과 근거를 따지는 습관 위에 정보·정서·서사 읽기가 큰 편차 없이 이어져요."},
  emo_sharp:{name:"감정 해석가",line:"시와 글에 담긴 감정의 결을 섬세하게 읽어요.",desc:"표현의 효과, 상징, 마음의 변화를 짚는 힘이 돋보여요. 사실 확인이나 조건 적용 영역에서는 상대적으로 덜 쓰고 있을 수 있어요."},
  emo_flat:{name:"따뜻한 공감 독자",line:"정서 읽기가 가장 높고, 다른 영역과도 균형이 잡혀 있어요.",desc:"글 속 마음을 잘 따라가면서 다른 영역도 큰 격차 없이 읽어 내는 편이에요."},
  narr_sharp:{name:"이야기 추적자",line:"인물의 관계와 행동 속 심리를 끝까지 따라가요.",desc:"장면과 대화에서 누가 누구에게 왜 그러는지를 잘 읽어요. 설명글이나 도표 영역에서는 상대적으로 덜 쓰고 있을 수 있어요."},
  narr_flat:{name:"이야기를 즐기는 독자",line:"서사 읽기가 가장 높고, 다른 영역과도 고르게 이어져요.",desc:"이야기의 흐름을 잘 타면서 다른 글도 무리 없이 읽는 편이에요."}
};
const TYPE_KEY={info:"info",intent:"intent",emo:"emo",narr:"narr"};
const TIPS={
  info:{good:"안내문·도표에서 순서, 기준, 예외를 정확히 짚는 힘",tip:"조건이나 예외를 알리는 말('단', '다만', '제외')에 먼저 밑줄을 치며 읽어 보세요."},
  intent:{good:"글 사이의 관계, 사실과 해석의 경계, 광고의 속뜻을 가려내는 힘",tip:"문장마다 '이건 사실일까, 의견일까?'를 한 번씩 물어보며 읽어 보세요."},
  emo:{good:"시 속 감정과 표현의 효과를 섬세하게 읽는 힘",tip:"시를 읽고 감정을 한 단어로 먼저 적은 뒤, 그렇게 느낀 근거 시구를 찾아보세요."},
  narr:{good:"인물의 관계와 장면 속 심리를 따라가는 힘",tip:"장면마다 '누가 누구에게 왜'를 짧게 메모하며 읽어 보세요."}
};
const LEVELS=[{max:5,name:"다지는 중"},{max:11,name:"탄탄함"},{max:16,name:"폭넓음"}];

// answers: {Q1: index|null}, meta: {Q1:{dur:ms}} , items: [{id,area,ans}]
function computeResult(items,answers,meta){
  const score={info:0,intent:0,emo:0,narr:0}, wscore={info:0,intent:0,emo:0,narr:0}, time={info:0,intent:0,emo:0,narr:0}, miss={info:0,intent:0,emo:0,narr:0};
  let vocab=null;
  for(const it of items){
    const a=answers[it.id];
    if(it.area==="vocab"){ vocab=(a==null)?null:(a===it.ans); continue; }
    if(!score.hasOwnProperty(it.area)) continue;
    time[it.area]+= (meta&&meta[it.id]&&meta[it.id].dur)||0;
    if(a==null){ miss[it.area]++; continue; }
    if(a===it.ans){ score[it.area]++; wscore[it.area]+=(WEIGHTS[it.id]||1); }
  }
  const vals=AREAS.map(x=>score[x.k]);
  const max=Math.max(...vals), min=Math.min(...vals);
  let cand=AREAS.map(x=>x.k).filter(k=>score[k]===max);
  let tieNote=null, tieBreak=null;
  if(cand.length>1){
    tieNote=cand.slice();
    const wmax=Math.max(...cand.map(k=>wscore[k]));
    let c2=cand.filter(k=>wscore[k]===wmax);
    if(c2.length>1){
      const hasTime=c2.every(k=>time[k]>0);
      if(hasTime){ const tmin=Math.min(...c2.map(k=>time[k])); c2=c2.filter(k=>time[k]===tmin); tieBreak="time"; }
    } else tieBreak="weight";
    if(c2.length>1){ c2=[TIE_ORDER.find(k=>c2.includes(k))]; tieBreak="order"; }
    cand=c2;
  }
  const rep=cand[0];
  const shape=(max-min)>=SHAPE_GAP?"sharp":"flat";
  const total=vals.reduce((a,b)=>a+b,0);
  const level=LEVELS.find(l=>total<=l.max).name;
  const missing=Object.values(miss).reduce((a,b)=>a+b,0);
  const lowest=AREAS.map(x=>x.k).filter(k=>score[k]===min);
  return {score,total,level,rep,shape,typeKey:rep+"_"+shape,tieNote,tieBreak,missing,miss,vocab,lowest,max,min,allEqual:max===min};
}
/*CORE_END*/

/* ---------- 문항 데이터 ---------- */
const GROUPS=[
 {id:"g1",label:"안내문 ①",src:"실제 기업 안내문의 사실 관계를 바탕으로 문장을 다시 쓴 글",
  html:`<p><b>[외장형 3단 정수 필터 교체 안내]</b></p><p>이 제품의 정수 필터는 3개가 위아래로 장착되어 있습니다. 상단과 중단은 카본 필터이고, 하단은 미생물을 걸러내는 UF 필터입니다.</p>
  <p><b>● 교체 시기</b> 교체 시기가 되면 표시창의 '필터 교체' 문구가 빨간색으로 바뀝니다. 필터는 1년마다 교체하는 것이 기준이며, 사용 환경에 따라 더 빨라질 수 있습니다. 필터 3개는 한꺼번에 교체합니다.</p>
  <p><b>● 교체 방법</b></p><ol>
  <li>싱크대 아래의 급수 밸브를 잠그고, 물 레버를 눌러 남은 압력을 뺍니다.</li>
  <li>필터는 손잡이를 잡고 왼쪽으로 돌려 분리합니다. 분리는 하단 → 중단 → 상단 순서로 하면 흘러나오는 물을 줄일 수 있습니다.</li>
  <li>새 필터는 오른쪽으로 돌려 장착합니다. 장착은 분리와 반대로 상단 → 중단 → 하단 순서로 합니다.</li>
  <li>급수 밸브를 다시 열고, 물을 약 10리터(5~6분) 받아서 버립니다.</li>
  <li>필터 장착 부분에서 물이 새지 않는지 확인합니다.</li>
  <li>필터 3개를 모두 교체한 뒤 얼음 버튼을 3초간 눌러 교체 기록을 초기화합니다.</li></ol>
  <p>※ 주의 UF 필터를 맨 아래에 조립하지 않으면 정수 성능이 떨어질 수 있습니다. 필터를 분리할 때 입구 쪽으로 물이 떨어질 수 있으니 필터를 위로 들어 주세요.</p>`,
  qs:[
  {id:"Q1",area:"info",ans:0,stem:"안내문에 따른 작업 순서로 알맞은 것은?",
   pre:"(가) 급수 밸브를 잠그고 물 레버로 압력을 뺀다<br>(나) 기존 필터를 분리한다<br>(다) 새 필터를 장착한다<br>(라) 밸브를 열고 약 10리터를 받아 버린다<br>(마) 필터 3개 교체 후 얼음 버튼을 3초간 눌러 초기화한다",
   opts:["(가)-(나)-(다)-(라)-(마)","(나)-(가)-(다)-(마)-(라)","(가)-(나)-(다)-(마)-(라)","(가)-(다)-(나)-(라)-(마)","(라)-(가)-(나)-(다)-(마)"]},
  {id:"Q2",area:"info",ans:1,stem:"정 씨 집 정수 필터는 설치한 지 9개월이 지났다. 어제부터 표시창의 '필터 교체' 문구가 빨간색으로 바뀌었다. 안내문에 따른 가장 적절한 행동은?",
   opts:["1년이 될 때까지 기다린다","지금 필터 3개를 모두 교체한다","하단 UF 필터 1개만 교체한다","빨간색 문구는 일시적이므로 무시한다","급수 밸브를 연 채로 필터를 분리한다"]}]},
 {id:"g2",label:"안내문 ②",src:"실제 구독 서비스 이벤트 유의사항의 사실 관계를 바탕으로 다시 쓴 글",
  html:`<p><b>[첫 달 구독 시 둘째 달 무료 이벤트 안내]</b></p>
  <p><b>● 혜택</b> 첫 달 구독료를 결제하면 둘째 달은 무료로 이용할 수 있습니다. 셋째 달부터는 정상 구독료가 자동으로 결제됩니다.</p>
  <p><b>● 대상</b> 현재 구독 중이 아닌 회원에 한해 1인 1회 참여할 수 있습니다. 기업 회원과 제휴 상품 이용 회원은 제외됩니다.</p>
  <p><b>● 유의사항</b></p><ol>
  <li>웹에서 결제하는 월 정기구독 상품에만 적용됩니다.</li>
  <li>첫 달 이용 중에 정기구독을 해지하면 둘째 달 무료 혜택은 제공되지 않습니다.</li>
  <li>둘째 달 무료 이용 중에 해지해도 둘째 달 마지막 날까지는 이용할 수 있습니다. 둘째 달은 결제 금액이 없으므로 환불 대상이 아닙니다.</li>
  <li>다른 할인 쿠폰과는 중복 적용되지 않습니다.</li>
  <li>중간에 환불을 요청하면, 할인 전 정상 구독료를 기준으로 사용한 일수만큼의 이용 대금과 수수료 10%를 뺀 금액이 환불됩니다.</li></ol>`,
  qs:[{id:"Q3",area:"info",ans:3,stem:"서연은 현재 구독 중이 아닌 회원이다. 3월 1일에 웹에서 월 정기구독 첫 달 구독료를 결제하고 이 이벤트를 적용받았다. 서연이 첫 달 이용 중인 3월 25일에 정기구독을 해지했다면, 안내문에 따라 알맞은 설명은?",
   opts:["4월 한 달은 무료로 이용할 수 있다.","3월 결제 금액이 해지 즉시 전액 환불된다.","4월 말까지 무료로 이용한 뒤 5월에 정상 구독료가 결제된다.","둘째 달 무료 혜택은 제공되지 않는다.","4월에는 이벤트 대신 정상 구독료의 일부가 할인된다."]}]},
 {id:"g3",label:"어휘",src:"",
  html:`<p>이번 매출 급증은 신제품에 대한 소비자의 호응을 <u>방증</u>한다.</p>`,
  qs:[{id:"Q4",area:"vocab",ans:4,stem:"밑줄 친 말의 뜻으로 알맞은 것은?",

 {id:"g4",label:"도표",src:"문화체육관광부 보도자료(2026.3.6.)의 수치를 정리한 표",
  html:`<p><b>[표] 성인과 학생의 독서 현황 (2025년 조사)</b></p><div class="tablewrap"><table>
  <tr><th>구분</th><th>성인</th><th>학생</th></tr>

  <p style="font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:8px">※ 독서율은 지난 1년간 일반도서(교과서·학습참고서·수험서·잡지·만화 제외)를 1권 이상 읽거나 들은 사람의 비율이다. 독서량에는 종이책, 전자책, 오디오북이 포함된다.</p>`,
  qs:[{id:"Q5",area:"info",ans:2,stem:"표를 바르게 해석한 것은?",
   opts:["독서량이 2023년보다 줄어든 권수는 성인이 학생보다 많다.","독서량이 2023년보다 줄어든 비율은 학생이 성인보다 크다.","독서량이 2023년보다 줄어든 비율은 성인이 학생보다 크다.","성인과 학생 모두 평일 하루 독서시간이 2023년보다 늘었다.","성인의 독서율이 학생보다 낮은 것은 독서량이 줄었기 때문이다."]}]},
 {id:"g5",label:"설명글 두 편",src:"산업통상자원부 보도자료(2023.8.31.) 바탕 · 〈보기〉는 새로 쓴 글",
  html:`<p><b>(가)</b> 넛지디자인은 넛지(nudge, '팔꿈치로 슬쩍 찌르다')의 개념을 적용하여 행동 변화를 유도하는 디자인이다. 부드러운 개입을 통해 사람들이 더 나은 선택을 하도록 이끄는 이 디자인은 안전, 에너지 절약, 자원순환 등 사회 문제를 해결하는 효과적인 수단으로 평가된다. 디자인을 단순한 외관 스타일링이 아니라 문제 해결과 사회 혁신의 도구로 활용한다는 점에서 새로운 디자인 시장도 생겨날 것으로 기대된다.</p>
  <p><b>(나)</b> 암스테르담 스키폴공항 남자화장실의 소변기에 파리 그림을 그린 결과, 밖으로 튀는 소변의 양이 80% 감소했다. 산업통상자원부는 서울시, 공공기관, 디자인단체 등 12개 기관과 함께 산업안전, 생활안전, 사회적약자 친화, 에너지절감, 자원순환의 5대 분야에서 넛지디자인 사업을 발굴해 추진하기로 했다.</p>`,
  qs:[
  {id:"Q6",area:"intent",ans:1,stem:"(가)와 (나)의 관계로 가장 적절한 것은?",
   opts:["(가)는 (나)의 결과를 예측한 보고서이다.","(나)는 (가)의 개념이 적용된 사례이다.","(나)는 (가)를 반박하는 반례이다.","(가)와 (나)는 서로 다른 두 개념을 비교한다.","(가)는 (나)의 한계를 보완하는 대안이다."]},
  {id:"Q7",area:"intent",ans:0,stem:"〈보기〉를 바탕으로 (가), (나)를 이해한 내용으로 적절하지 않은 것은?",
   pre:"〈보기〉 넛지는 선택지를 금지하지 않는다는 점에서 지지를 받지만, 사람들이 자신이 유도되고 있다는 사실을 모른 채 선택한다면 선택의 자유가 실질적으로 줄어든다는 비판도 있다. 이에 유도의 목적과 방식을 알려야 한다는 주장이 제기된다.",
   opts:["〈보기〉에 따르면 넛지가 비판받는 이유는 특정 선택지를 법으로 금지하기 때문이다.","(가)에 따르면 넛지디자인은 부드러운 개입으로 더 나은 선택을 하도록 이끈다.","(나)의 파리 그림은 소변기를 쓰는 사람의 행동을 바꾸려는 설계로 볼 수 있다.","〈보기〉의 관점에서는 (나)의 방식에서 이용자가 유도 사실을 모를 수 있다는 점이 논의될 수 있다.","〈보기〉의 주장에 따르면 유도의 목적과 방식을 알리는 것이 대안이 될 수 있다."]},
  {id:"Q8",area:"check",ans:null,stem:"(풀이 점검) Q7을 풀기 전에 가장 먼저 한 행동은?",
   opts:["〈보기〉를 먼저 읽었다","선택지를 먼저 훑었다","(가), (나)를 다시 읽었다","바로 답을 골랐다"]},
  {id:"Q9",area:"check",ans:null,stem:"(풀이 점검) Q7을 풀며 가장 어려웠던 점은?",
   opts:["낯선 낱말","(가), (나)의 내용 파악","〈보기〉와 지문 연결","선택지 의미 구분","어려운 점이 없었다"]}]},
 {id:"g6",label:"보도자료",src:"문화체육관광부 보도자료 발췌(2026.3.6.)",
  html:`<p><b>[문화체육관광부 보도자료 발췌 · 2026.3.6.]</b></p>
  <p><b>㉠</b> 성인의 연간 종합독서율은 38.5%, 종합독서량은 2.4권으로, 2023년 조사와 비교하면 종합독서율은 4.5%포인트, 독서량은 1.5권 감소했다.</p>
  <p><b>㉡</b> 20대(만 19~29세)의 연간 종합독서율은 75.3%로, 2023년보다 0.8%포인트 증가했다.</p>
  <p><b>㉢</b> 성인이 독서를 하는 가장 큰 이유는 '책 읽는 것이 재미있어서(20.3%)'였다. 2019년과 2021년 조사에서는 '지식과 정보 습득'이, 2023년 조사에서는 '마음의 성장(위로)'이 1순위였다.</p>
  <p><b>㉣</b> 이는 독서 본연의 즐거움에 대한 인식이 강해지고 있음을 보여준다.</p>
  <p><b>㉤</b> 성인과 학생 모두 독서하기 어려운 가장 큰 이유로는 '일(공부) 때문에 시간이 없어서'를 꼽았다.</p>`,
  qs:[{id:"Q10",area:"intent",ans:3,stem:"㉠~㉤ 중 조사 결과 그 자체(사실)가 아니라 조사 결과에 대한 해석(의견)에 해당하는 것은?",
   opts:["㉠","㉡","㉢","㉣","㉤"]}]},
 {id:"g7",label:"안내문 ③",src:"공정거래위원회 추천·보증 표시 안내의 취지를 다시 쓴 글",
  html:`<p><b>[온라인 후기와 광고 표시 안내]</b></p>
  <p><b>● 추천·보증</b> 광고주가 아닌 제3자의 독자적인 의견으로 보일 수 있는, 상품·서비스를 좋게 평가하거나 구매·사용을 권하는 글을 말합니다.</p>
  <p><b>● 경제적 이해관계</b> 광고주가 후기 작성자에게 현금, 무료 상품·서비스, 할인 혜택 등을 주는 경우, 또는 고용·친족 관계처럼 이익을 공유하는 경우입니다. 경품 추첨이나 우수 후기 선정을 기대하고 후기를 올리는 경우처럼 나중에 조건부로 대가를 받는 것도 포함됩니다. 처음에는 대가 없이 쓴 후기라도 나중에 광고주가 대가를 주고 활용한다면 해당됩니다.</p>
  <p><b>● 표시 방법</b> 경제적 이해관계가 있다면 소비자가 쉽게 알아볼 수 있게 표시해야 합니다. 블로그 글은 제목이나 첫 부분에 표시하고, '더보기'를 눌러야 보이는 곳, 본문 중간, 댓글, 별도 페이지에 적는 것은 적절하지 않습니다. 한국어 글에서 외국어 표현만 단독으로 쓰는 것도 알아보기 어려워 부적절합니다.</p>`,
  qs:[{id:"Q11",area:"intent",ans:2,stem:"안내문을 바탕으로 인터넷 후기를 읽는 태도로 적절하지 않은 것은?",
   opts:["업체에서 무료 제품을 받고 쓴 후기라면 글의 제목이나 첫 부분에 그 사실이 표시되어 있어야 한다.","우수 후기로 뽑히면 경품을 준다는 조건으로 쓴 후기도 대가 관계를 확인해 볼 필요가 있다.","작성자가 직접 구입한 상품을 칭찬한 글이면 표시 문구가 없어도 광고주와 무관한 후기라고 단정할 수 있다.","글 맨 끝의 '더보기'를 눌러야 보이는 협찬 문구는 적절하게 표시한 것으로 보기 어렵다.","한국어 후기 첫머리에 외국어 표현만 쓰여 있다면 소비자가 광고임을 알아보기 어려울 수 있다."]}]},
 {id:"g8",label:"시 ①",src:"윤동주 「쉽게 씌어진 시」(1942) · 표기를 현대어로 옮김",
  html:`<div class="poem"><p>창밖에 밤비가 속살거려</p><p>육첩방(六疊房)은 남의 나라,</p><div class="gap"></div>
  <p>시인이란 슬픈 천명(天命)인 줄 알면서도</p><p>한 줄 시를 적어 볼까,</p><div class="gap"></div>
  <p>땀내와 사랑내 포근히 품긴</p><p>보내 주신 학비 봉투를 받아</p><div class="gap"></div>
  <p>대학 노트를 끼고</p><p>늙은 교수의 강의 들으러 간다.</p><div class="gap"></div>
  <p>생각해 보면 어린 때 동무를</p><p>하나, 둘, 죄다 잃어버리고</p><div class="gap"></div>
  <p>나는 무얼 바라</p><p>나는 다만, 홀로 침전(沈澱)하는 것일까?</p><div class="gap"></div>
  <p>인생은 살기 어렵다는데</p><p>시가 이렇게 쉽게 씌어지는 것은</p><p>부끄러운 일이다.</p><div class="gap"></div>
  <p>육첩방은 남의 나라</p><p>창밖에 밤비가 속살거리는데,</p><div class="gap"></div>
  <p>등불을 밝혀 어둠을 조금 내몰고,</p><p>시대처럼 올 아침을 기다리는 최후의 나,</p><div class="gap"></div>
  <p>나는 나에게 작은 손을 내밀어</p><p>눈물과 위안(慰安)으로 잡는 최초의 악수(握手).</p><div class="gap"></div><p>(1942. 6. 3)</p></div>`,
  qs:[
  {id:"Q12",area:"emo",ans:4,stem:"이 시에서 화자가 느끼는 정서로 가장 적절한 것은?",
   opts:["이별한 연인을 떠올리며 느끼는 애틋한 그리움","타국에서 공부하는 자신에 대한 만족과 자부심","학비를 보내 준 가족에 대한 원망과 분노","곧 이루어질 일에 대한 들뜬 기대와 낙관","낯선 곳에서의 고독과 부끄러움 속에서 자신을 위로하는 마음"]},
  {id:"Q13",area:"emo",ans:2,stem:"'육첩방은 남의 나라'가 시에서 두 번 나오는 것의 효과로 가장 적절한 것은?",
   opts:["이국적인 풍경에 대한 감탄을 드러낸다.","고향 집의 방이 좁다는 불만을 나타낸다.","화자가 낯선 곳에서 느끼는 소외감과 고독을 강조한다.","운율을 깨뜨려 긴장감을 조성한다.","새로운 사건이 시작됨을 알린다."]}]},
 {id:"g9",label:"시 ②",src:"윤동주 「자화상」(일부) · 표기를 현대어로 옮김",
  html:`<div class="poem"><p>산모퉁이를 돌아 논가 외딴 우물을 홀로 찾아가선</p><p>가만히 들여다봅니다.</p><div class="gap"></div>
  <p>우물 속에는 달이 밝고 구름이 흐르고 하늘이 펼치고</p><p>파아란 바람이 불고 가을이 있습니다.</p><div class="gap"></div>
  <p>그리고 한 사나이가 있습니다.</p><p>어쩐지 그 사나이가 미워져 돌아갑니다.</p><div class="gap"></div>
  <p>돌아가다 생각하니 그 사나이가 가엾어집니다.</p><p>도로 가 들여다보니 사나이는 그대로 있습니다.</p></div>`,

function finish(){
  const r=computeResult(ITEMS,S.answers,S.meta);
  S.result=r;
  const payload={
    v:1,id:(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),ts:new Date().toISOString(),
    order:S.order.map(i=>GROUPS[i].id),
    profile:S.profile,
    answers:Object.fromEntries(ITEMS.map(it=>[it.id,S.answers[it.id]==null?null:S.answers[it.id]])),
    dur:Object.fromEntries(Object.entries(S.meta).map(([k,v])=>[k,v.dur])),
    skipped:Object.entries(S.meta).filter(([k,v])=>v.skipped).map(([k])=>k),
    groupMs:S.gTimes,totalMs:Date.now()-S.startedAt,
    scores:r.score,vocab:r.vocab,total:r.total,type:r.typeKey,tie:r.tieNote,tieBreak:r.tieBreak
  };
  S.payload=payload;
  S.code=JSON.stringify(payload);
  viewResult();
  save(payload);
}
async function save(payload){
  S.saveState="saving";paintSave();
  try{
    if(!ENDPOINT)throw new Error("no endpoint");
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:KEY,data:payload})});
    S.saveState="ok";
  }catch(e){S.saveState="fail";}
  paintSave();
}
function paintSave(){
  const n=document.getElementById("savebox");if(!n)return;
  const t={saving:"응답을 보내는 중…",ok:"응답을 보냈어요. 참여해 주셔서 고마워요!",fail:"응답을 보내지 못했어요. 아래 응답 코드를 복사해서 운영자에게 전달해 주세요.",idle:""}[S.saveState];
  n.firstChild.textContent=t;
  n.querySelector(".codewrap").hidden=S.saveState!=="fail";
}

/* ---------- 화면: 결과 ---------- */
function radarSVG(r){
  const cx=130,cy=120,R=80,axes=[["info",-90],["intent",0],["emo",90],["narr",180]];
  const pt=(deg,v)=>{const a=deg*Math.PI/180;return [cx+Math.cos(a)*R*v/4,cy+Math.sin(a)*R*v/4];};
  const ns="http://www.w3.org/2000/svg";
  const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 260 240");s.setAttribute("class","radar");s.setAttribute("role","img");
  s.setAttribute("aria-label","영역별 점수 "+AREAS.map(a=>a.name+" "+r.score[a.k]+"점").join(", "));
  const add=(t,at,txt)=>{const e=document.createElementNS(ns,t);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;s.appendChild(e);return e;};
  [1,2,3,4].forEach(l=>add("polygon",{points:axes.map(([k,d])=>pt(d,l).join(",")).join(" "),fill:"none",stroke:"var(--line)","stroke-width":l===4?1.5:1}));
  axes.forEach(([k,d])=>{const p=pt(d,4);add("line",{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:"var(--line)"});});
  add("polygon",{points:axes.map(([k,d])=>pt(d,r.score[k]).join(",")).join(" "),fill:"var(--accent)","fill-opacity":.22,stroke:"var(--accent)","stroke-width":2.5,"stroke-linejoin":"round"});
  axes.forEach(([k,d])=>{const p=pt(d,r.score[k]);add("circle",{cx:p[0],cy:p[1],r:4,fill:areaColor(k)});});
  const lab={info:[cx,cy-R-14,"middle"],intent:[cx+R+10,cy+4,"start"],emo:[cx,cy+R+22,"middle"],narr:[cx-R-10,cy+4,"end"]};
  axes.forEach(([k])=>{const l=lab[k];const t=add("text",{x:l[0],y:l[1],"text-anchor":l[2]},AREAS.find(a=>a.k===k).name+" "+r.score[k]);});
  return s;
}

  intent:{five:"뉴스 기사 한 단락에서 사실 문장과 의견 문장을 색을 달리해 나눠 보세요.",week:"광고나 후기 글 3개를 골라 '누가, 왜 쓴 글일까?'를 한 줄씩 적어 보세요."},
  emo:{five:"시 한 편을 읽고 느낀 감정을 한 단어로 적은 뒤, 그 단어를 떠올리게 한 시구에 밑줄을 쳐 보세요.",week:"매일 시 한 편을 읽고 감정 단어를 기록하고, 일주일 뒤 단어 목록을 돌아보세요."},
  narr:{five:"소설 한 장면을 읽고 '누가 누구에게 왜 그랬는지'를 세 줄로 메모해 보세요.",week:"단편소설 한 편의 인물 관계도를 그려 보고, 인물의 마음이 바뀐 지점에 표시해 보세요."}
};

function viewResult(){
  S.screen="result";
  const r=S.result,T=TYPES[r.typeKey],repA=AREAS.find(a=>a.k===r.rep);
  const name=k=>AREAS.find(a=>a.k===k).name;
  const lowK=AREAS.map(a=>a.k).find(k=>r.lowest.includes(k));
  const wrap=el("div",{class:"stack"});
  const card=el("div",{class:"card type stack",style:"--tc:"+areaColor(r.rep)+";align-items:center;text-align:center"});
  const fig=el("div",{html:CHAR_SVG,style:"width:170px"});
  card.append(fig,el("div",{class:"row",style:"justify-content:center"},el("span",{class:"pill"},"대표 영역 · "+repA.name),el("span",{class:"pill"},r.shape==="sharp"?"뾰족형":"고른형")),
    ...(r.total===0?[el("h1",{},"유형을 정하기 어려워요")]:[el("h1",{},T.name),el("p",{style:"font-weight:500"},T.line)]));
  if(r.allEqual&&r.max>0)card.append(el("p",{class:"note"},"네 영역의 점수가 같아서 대표 영역은 고정 순서로 정했어요. 영역별 점수를 함께 봐 주세요."));
  else if(r.tieNote&&r.tieNote.length>1)card.append(el("p",{class:"note"},"두 영역("+r.tieNote.map(name).join("·")+")이 거의 비슷해요. 보조 기준으로 대표 영역을 정했어요."));
  wrap.append(card);
  wrap.append(el("div",{class:"card stack"},el("h2",{},"영역별 점수"),radarSVG(r),
    el("p",{class:"muted",style:"text-align:center"},"읽기 점수 "+r.total+"/16 · 시범 기준 '"+r.level+"'")));
  if(r.total>0&&!r.allEqual){
    wrap.append(el("div",{class:"card stack",style:"--tc:"+areaColor(lowK)},
      el("span",{class:"eyebrow"},"오늘의 5분 활동 · "+name(lowK)),
      el("p",{style:"font-weight:500"},ACTS[lowK].five)));
  }
  const det=el("details",{class:"card more"});
  det.append(el("summary",{},"자세히 보기"),
    el("div",{class:"stack",style:"margin-top:12px"},
      el("p",{},T.desc),
      el("p",{html:"<b>잘 쓰고 있는 힘</b><br>"+AREAS.filter(a=>r.score[a.k]===r.max).map(a=>a.name+" — "+TIPS[a.k].good).join("<br>")}),
      ...(r.total>0&&!r.allEqual?[el("p",{html:"<b>일주일 활동 · "+name(lowK)+"</b><br>"+ACTS[lowK].week}),el("p",{html:"<b>읽는 습관</b><br>"+TIPS[lowK].tip})]:[])));
  wrap.append(det);
  if(r.missing>=3)wrap.append(el("p",{class:"note"},"건너뛴 문항이 "+r.missing+"개 있어서 결과가 실제보다 낮게 나왔을 수 있어요."));
  wrap.append(el("div",{class:"card stack",id:"savebox"},el("p",{class:"muted"},""),
    el("div",{class:"codewrap stack",hidden:""},el("textarea",{class:"code",readonly:"",id:"codeta"},S.code),el("button",{class:"btn ghost",onclick:copyCode},"응답 코드 복사"))));
  wrap.append(el("p",{class:"muted"},"이 결과는 재미와 참고를 위한 것이며 공식 진단이 아니에요. 시범 운영 결과를 바탕으로 문항과 유형 기준이 바뀔 수 있어요."));
  mount(wrap);paintSave();
}
async function copyCode(){
  const ta=document.getElementById("codeta");
  try{await navigator.clipboard.writeText(S.code);}catch(e){ta.select();}
}
